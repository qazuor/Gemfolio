services:
  postgres:
    image: postgres:16-alpine
    container_name: gemfolio_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gemfolio
      POSTGRES_PASSWORD: gemfolio_dev
      POSTGRES_DB: gemfolio_db
    ports:
      - "5434:5432"
    volumes:
      - gemfolio_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemfolio -d gemfolio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gemfolio_postgres_data:
    driver: local
